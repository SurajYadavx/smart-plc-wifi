; PlatformIO Project Configuration File
; Project V2: Mitsubishi Q/R Series Dual-PLC Local Supervisory Gateway
; Target: ESP32 DevKit (WROOM-32 / ESP32-WROOM-32D)

[platformio]
default_envs = esp32dev
src_dir = src
data_dir = data

[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino

; Serial Monitor & Upload
monitor_speed = 115200
upload_speed = 921600

; Flash partition scheme: 4MB Flash (1.2MB App, 1.5MB LittleFS data)
board_build.partitions = default.csv
board_build.filesystem = littlefs

; Build flags: optimization, C++17, littlefs enabled
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_LITTLEFS_FOR_IDF_3_2
    -D FIRMWARE_VERSION=\"2.2.0\"

; Required Libraries
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
